openapi: 3.0.3

info:
  title: Employee Management System API
  version: 1.0.0
  description: API documentation for the Employee Management System

servers:
  - url: http://localhost:3000
    description: Local development server

tags:
  - name: Employees
    description: Employee management operations
  - name: Authentication
    description: Login and authentication operations
  - name: Users
    description: User account management operations

paths:
  /api/v1/employees:
    get:
      summary: Get all employees with pagination
      description: Returns employees for the requested page. Page defaults to 1, limit defaults to 10, and the maximum limit is 100.
      tags:
        - Employees
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          description: Page number, starting from 1
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - name: limit
          in: query
          required: false
          description: Number of employees per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          example: 10
      responses:
        "200":
          description: Employees retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  count:
                    type: integer
                    description: Number of employees returned on this page
                    example: 10
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        full_name:
                          type: string
                          example: Rahul Sharma
                        email:
                          type: string
                          format: email
                          example: rahul@example.com
                        phone:
                          type: string
                          nullable: true
                          example: "9876543210"
                        department:
                          type: string
                          nullable: true
                          example: Engineering
                        job_title:
                          type: string
                          nullable: true
                          example: Software Developer
                        salary:
                          type: number
                          nullable: true
                          example: 60000
                        joining_date:
                          type: string
                          format: date
                          nullable: true
                          example: "2026-01-15"
                        created_at:
                          type: string
                          format: date-time
                  pagination:
                    type: object
                    properties:
                      total:
                        type: integer
                        description: Total number of employees across all pages
                        example: 11
                      page:
                        type: integer
                        example: 1
                      limit:
                        type: integer
                        example: 10
                      totalPages:
                        type: integer
                        example: 2
                      hasNextPage:
                        type: boolean
                        example: true
                      hasPreviousPage:
                        type: boolean
                        example: false
        "400":
          description: Invalid pagination parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: Page and limit must be positive integers
        "401":
          description: Authentication required
        "403":
          description: Insufficient permissions

    post:
      summary: Create a new employee profile
      tags:
        - Employees
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - full_name
                - email
              properties:
                full_name:
                  type: string
                  example: Rahul Sharma
                email:
                  type: string
                  format: email
                  example: rahul@example.com
                phone:
                  type: string
                  nullable: true
                  example: "9876543210"
                department:
                  type: string
                  nullable: true
                  example: IT
                job_title:
                  type: string
                  nullable: true
                  example: Software Developer
                salary:
                  type: number
                  nullable: true
                  minimum: 0
                  example: 45000
      responses:
        "201":
          description: Employee profile created successfully
        "400":
          description: Validation failed
        "401":
          description: Authentication required
        "403":
          description: Insufficient permissions
        "409":
          description: Employee with this email already exists

  /api/v1/employees/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
        description: Employee profile ID

    get:
      summary: Get employee by ID
      tags:
        - Employees
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Employee retrieved successfully
        "400":
          description: Invalid employee ID
        "401":
          description: Authentication required
        "403":
          description: Insufficient permissions
        "404":
          description: Employee not found

    patch:
      summary: Update an employee
      tags:
        - Employees
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                full_name:
                  type: string
                  example: Amit Verma
                email:
                  type: string
                  format: email
                  example: amit.verma@example.com
                phone:
                  type: string
                  nullable: true
                  example: "9876543211"
                department:
                  type: string
                  nullable: true
                  example: Engineering
                job_title:
                  type: string
                  nullable: true
                  example: Software Developer
                salary:
                  type: number
                  nullable: true
                  minimum: 0
                  example: 50000
      responses:
        "200":
          description: Employee updated successfully
        "400":
          description: Invalid request body or validation failed
        "401":
          description: Authentication required
        "403":
          description: Insufficient permissions
        "404":
          description: Employee not found
        "409":
          description: Employee with this email already exists

    delete:
      summary: Delete an employee
      tags:
        - Employees
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Employee deleted successfully
        "400":
          description: Invalid employee ID
        "401":
          description: Authentication required
        "403":
          description: Only Admin users can delete employees
        "404":
          description: Employee not found

  /api/v1/auth/login:
    post:
      summary: Login to the Employee Management System
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: admin@example.com
                password:
                  type: string
                  format: password
                  example: "EnterYourPassword123!"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Login successful
                  token:
                    type: string
                    description: JWT access token
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      full_name:
                        type: string
                        example: System Admin
                      email:
                        type: string
                        format: email
                        example: admin@example.com
                      role:
                        type: string
                        enum:
                          - admin
                          - hr
                          - employee
                        example: admin
        "400":
          description: Email and password are required
        "401":
          description: Invalid email or password
        "500":
          description: Internal server error

  /api/v1/auth/me:
    get:
      summary: Get the currently authenticated user
      tags:
        - Authentication
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authenticated user retrieved successfully
        "401":
          description: Missing, invalid, or expired token, or unavailable user account
        "500":
          description: Internal server error

  /api/v1/users/hr:
    post:
      summary: Create a new HR account
      description: Only authenticated Admin users can create HR accounts.
      tags:
        - Users
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - full_name
                - email
                - password
              properties:
                full_name:
                  type: string
                  example: Priya Sharma
                email:
                  type: string
                  format: email
                  example: priya.hr@example.com
                password:
                  type: string
                  format: password
                  minLength: 12
                  example: "EnterAStrongPassword123!"
      responses:
        "201":
          description: HR account created successfully
        "400":
          description: Required fields are missing or validation failed
        "401":
          description: Missing, invalid, or expired authentication token
        "403":
          description: Only Admin users can create HR accounts
        "409":
          description: A user with this email already exists
        "500":
          description: Internal server error

  /api/v1/users/employee:
    post:
      summary: Create an employee account and profile
      description: Creates a login account and linked employee profile. Only Admin and HR users can perform this action.
      tags:
        - Users
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - full_name
                - email
                - password
              properties:
                full_name:
                  type: string
                  example: Karan Mehta
                email:
                  type: string
                  format: email
                  example: karan.employee.test@example.com
                password:
                  type: string
                  format: password
                  minLength: 12
                  example: "StrongEmployeePassword123!"
                phone:
                  type: string
                  nullable: true
                  example: "9876543210"
                department:
                  type: string
                  nullable: true
                  example: Engineering
                job_title:
                  type: string
                  nullable: true
                  example: Software Developer
                salary:
                  type: number
                  nullable: true
                  minimum: 0
                  example: 45000
      responses:
        "201":
          description: Employee account and profile created successfully
        "400":
          description: Required fields are missing or validation failed
        "401":
          description: Missing, invalid, or expired authentication token
        "403":
          description: Only Admin and HR users can create employee accounts
        "409":
          description: Account or employee with this email already exists
        "500":
          description: Internal server error

  /api/v1/users/{id}/password:
    patch:
      summary: Reset a user's password
      description: Only authenticated Admin users can reset a user's password. This operation sets a new password; it cannot recover the old password.
      tags:
        - Users
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: User account ID, not employee profile ID
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
              properties:
                password:
                  type: string
                  format: password
                  minLength: 12
                  description: New password with at least 12 characters
                  example: "ChooseYourOwnStrongPassword123!"
      responses:
        "200":
          description: Password reset successfully
        "400":
          description: Invalid user ID or password
        "401":
          description: Missing, invalid, or expired authentication token
        "403":
          description: Only Admin users can reset passwords
        "404":
          description: User account not found
        "500":
          description: Internal server error

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
